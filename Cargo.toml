[package]
name = "session-finder"
version = "0.1.0"
edition = "2024"
description = "Fast, local Codex session search and terminal browser"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
dirs = "6"
iana-time-zone = "0.1"
rayon = "1"
regex = "1"
rusqlite = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
unicode-segmentation = "1"
url = "2"
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.38", features = ["bundled-sqlcipher"] }
pbkdf2 = "0.12"
zeroize = "1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
